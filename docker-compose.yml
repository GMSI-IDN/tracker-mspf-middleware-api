services:
  gateway:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
