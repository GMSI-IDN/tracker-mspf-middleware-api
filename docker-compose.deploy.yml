services:
  gateway:
    image: ${IMAGE}:${IMAGE_TAG}
    container_name: mspf-middleware-gateway-${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Otomatis untuk nginx-proxy
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${PORT}
      - PORT=${PORT}
      - RUN_MIGRATIONS=false
      - NODE_ENV=${NODE_ENV}
      - DB_DRIVER=${DB_DRIVER}
      - DB_PATH=${DB_PATH}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - TRACCAR_URL=${TRACCAR_URL}
      - TRACCAR_USERNAME=${TRACCAR_USERNAME}
      - TRACCAR_PASSWORD=${TRACCAR_PASSWORD}
      - MSPF_URL=${MSPF_URL}
      - MSPF_CLIENT_ID=${MSPF_CLIENT_ID}
      - MSPF_CLIENT_SECRET=${MSPF_CLIENT_SECRET}
      - MSPF_TOKEN_URL=${MSPF_TOKEN_URL}
      - CACHE_DEVICE_TTL=${CACHE_DEVICE_TTL}
      - CACHE_PROVIDER=${CACHE_PROVIDER}
      - MCCS_CACHE_TTL=${MCCS_CACHE_TTL}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX}
      - WEBSOCKET_PATH=${WEBSOCKET_PATH}
      - POLL_INTERVAL=${POLL_INTERVAL}
      - REDIS_URL=${REDIS_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=${LOG_LEVEL}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
    expose:
      - "${PORT}"
    volumes:
      - ./data:/app/data
    networks:
      - net

networks:
  net:
    external: true
    name: ${PROXY_NETWORK:-net}
