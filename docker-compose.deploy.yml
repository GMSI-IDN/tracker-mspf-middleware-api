services:
  gateway:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Otomatis untuk nginx-proxy + acme-companion (HTTPS)
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${PORT:-3000}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - PORT=${PORT:-3000}
      - RUN_MIGRATIONS=false
      - NODE_ENV=${NODE_ENV:-production}
      - DB_DRIVER=${DB_DRIVER}
      - DB_PATH=${DB_PATH}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - TRACCAR_URL=${TRACCAR_URL}
      - TRACCAR_USERNAME=${TRACCAR_USERNAME}
      - TRACCAR_PASSWORD=${TRACCAR_PASSWORD}
      - MSPF_URL=${MSPF_URL}
      - MSPF_CLIENT_ID=${MSPF_CLIENT_ID}
      - MSPF_CLIENT_SECRET=${MSPF_CLIENT_SECRET}
      - MSPF_TOKEN_URL=${MSPF_TOKEN_URL}
      - FOXLOGGER_EMAIL=${FOXLOGGER_EMAIL}
      - FOXLOGGER_PASSWORD=${FOXLOGGER_PASSWORD}
      - FOXLOGGER_TIMEZONE=${FOXLOGGER_TIMEZONE:-Asia/Jakarta}
      - DEFAULT_USER_TIMEZONE=${DEFAULT_USER_TIMEZONE:-Asia/Jakarta}
      - CACHE_DEVICE_TTL=${CACHE_DEVICE_TTL}
      - MCCS_CACHE_TTL=${MCCS_CACHE_TTL}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX}
      - WEBSOCKET_PATH=${WEBSOCKET_PATH}
      - POLL_INTERVAL=${POLL_INTERVAL}
      - REDIS_URL=${REDIS_URL}
      - OFFLINE_THRESHOLD_MS=${OFFLINE_THRESHOLD_MS:-600000}
      - ONLINE_THRESHOLD_MS=${ONLINE_THRESHOLD_MS:-600000}
      - STATUS_COOLDOWN_MS=${STATUS_COOLDOWN_MS:-60000}
      - DEVICE_STATUS_HEARTBEAT_MS=${DEVICE_STATUS_HEARTBEAT_MS:-90000}
      - POSITION_EMIT_CHANGE_ONLY=${POSITION_EMIT_CHANGE_ONLY:-true}
      - TRACCAR_OFFLINE_THRESHOLD_MS=${TRACCAR_OFFLINE_THRESHOLD_MS:-0}
      - MSPF_OFFLINE_THRESHOLD_MS=${MSPF_OFFLINE_THRESHOLD_MS:-0}
      - FOXLOGGER_OFFLINE_THRESHOLD_MS=${FOXLOGGER_OFFLINE_THRESHOLD_MS:-0}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - LOG_LEVEL=${LOG_LEVEL}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
    expose:
      - "${PORT:-3000}"
    volumes:
      - ./data:/app/data
    networks:
      - net

networks:
  net:
    external: true
    name: ${PROXY_NETWORK:-net}
