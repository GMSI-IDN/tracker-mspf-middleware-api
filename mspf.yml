          type: string
          format: date-time
          example: '2020-07-20T15:32:28Z'
          maxLength: 50
        positionStart:
          $ref: '#/components/schemas/TripPosition'
        timeEnd:
          type: string
          format: date-time
          example: '2020-07-20T15:32:28Z'
          maxLength: 50
        positionEnd:
          $ref: '#/components/schemas/TripPosition'
      required: [timeStart, positionStart, timeEnd, positionEnd]
    DeviceParkingRanking:
      type: object
      properties:
        lat:
          type: string
          example: '35.681382'
        lon:
          type: string
          example: '139.766084'
        ranking:
          type: number
          enum: [1, 2, 3]
        accuracy:
          type: string
          enum: [A, B, C]
        startWeek:
          type: string
          format: date
          example: '2021-07-01'
        endWeek:
          type: string
          format: date
          nullable: true
          example: '2021-07-01'
        lastParkingStart:
          type: string
          nullable: true
          description: The start time of the last parking session
          example: '2024-01-15 09:15'
        lastParkingEnd:
          type: string
          nullable: true
          description: The end time of the last parking session
          example: '2024-01-15 11:00'
        lastParkingHour:
          type: number
          nullable: true
          description: The hour (0-23) of the last parking session
          minimum: 0
          maximum: 23
          example: 9
        manyParkingHours:
          type: array
          items:
            type: number
            minimum: 0
            maximum: 23
          description: Array of hours (0-23) when parking frequently occurs
          example: [9, 14, 18, 21]
      required: [lat, lon, ranking, accuracy, startWeek, lastParkingStart, lastParkingEnd, lastParkingHour, manyParkingHours]
    DeviceTag:
      type: object
