  '/v2/event':
    get:
      summary: Get Event List. The data retention period is 1 year.
      parameters:
        - name: bcId
          in: query
          schema:
            type: integer
          description: ID of the BC
          required: true
        - name: monitorId
          in: query
          description: ID of the Monitor
          schema:
            type: integer
        - name: deviceId
          in: query
          schema:
            type: integer
          description: ID of the Device
        - name: status
          in: query
          description: Whether to get `OPEN` or `CLOSE` EVENT. If `OPEN`, the Event list consists of 'OPEN' since 1 year ago. If CLOSE, the Event list consists of 'CLOSE' Event between `from` and `to`.
          schema:
            type: string
            enum: ['OPEN', 'CLOSE']
            default: 'OPEN'
        - name: from
          in: query
          description: 'Start of Event opened time range. This parameter has to be used together with `status=CLOSE` and `to`. (Default: current time - 7 days)'
          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
        - name: to
          in: query
          description: 'End of Event opened time range. This parameter has to be used together with `status=CLOSE` and `from`. (Default: current time)'
          schema:
            type: string
            format: date-time
            example: '2020-07-27T15:32:28Z'
      responses:
        '200':
          description: The request is successfully finished. The response is sorted in ascending order (ASC).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventV2'
                required: [data]
      tags:
        - Event
