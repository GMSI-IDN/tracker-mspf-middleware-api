  '/v4/devices':
    get:
      summary: Get a list of Devices with page-based pagination
      parameters:
        - name: bc[]
          in: query
          description: An array of the bcId
          schema:
            type: array
            items:
              type: integer
          example: [1, 2]
        - name: device[]
          in: query
          description: An array of the deviceId.
          schema:
            type: array
            items:
              type: integer
          example: [1, 2]
        - name: deviceTypeId
          in: query
          schema:
            $ref: '#/components/schemas/DeviceTypeId'
        - name: deviceType
          deprecated: true
          in: query
          schema:
            $ref: '#/components/schemas/DeviceTypeName'
        - name: mobileNo
          in: query
          schema:
            $ref: '#/components/schemas/MobileNumberInput'
        - name: status
          in: query
          schema:
            type: string
            enum: ['WORKING', 'SUSPENDED']
        - name: tags
          in: query
          style: deepObject
          explode: true
          description: Tags of the Device. Normally it is AND search, but if you specify multiple tags with the same key, they will be an OR search.
          schema:
            type: object
          example: {'tag1': 'value1', 'tag2': 'value2'}
        - name: tags[]
          in: query
          description: Tags of the Device. You can use `tags[]` to search multiple keys of tags.
          schema:
            type: array
            items:
              type: string
          example: ['tag1', 'tag2']
        - name: query
          in: query
          description: query word of search condition.
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: sortBy
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum:
              - lastCommunicatedAt
        - name: sortOrder
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: activationCurrentStatus
          in: query
          description: Status of each terminal. Returns `ACTIVE` if the terminal is "under start control" and `INACTIVE` if the terminal is "under stop control".
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
        - name: activationReservation
          in: query
          description: With or without activation reservation.
          schema:
            type: string
            enum: ['ON', 'OFF']
        - name: imei
          in: query
          schema:
            $ref: '#/components/schemas/IMEIInput'
        - name: fwVersion[]
          in: query
          description: FW version of the device.
          schema:
            type: array
            items:
              type: string
          example: ['IIIJ1.04', 'IIIJ1.05Test']
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  paging:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: Current page number
                      perPage:
                        type: integer
                        description: Number of items per page
                      total:
                        type: integer
                        description: Total number of items
                    required: [page, perPage, total]
                required: [data, paging]
        '400':
          description: Invalid parameter format or perPage exceeds limit (200).
        '404':
          description: The BC is not found.
      tags:
        - Device
