            BC ID of search condition.
          schema:
            type: integer
          required: true
        - name: deviceId
          in: query
          description: ID of the Device
          schema:
            type: integer
          required: false
        - name: resource
          in: query
          description: Operation category
          schema:
            type: string
            enum:
              - DEVICE_COMMAND
              - DEVICE
              - OTA_UPDATE
          required: false
        - name: from
          in: query
          description: |
            'Start of audit time range. This parameter has to be used together with `to`.
            (Default: current time - 45 days)'
          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
        - name: to
          in: query
          description: 'End of audit time range. This parameter has to be used together with `from`. (Default: current time)'
          schema:
            type: string
            format: date-time
            example: '2020-08-20T15:32:28Z'
        - name: start
          in: query
          description: The token of `next` from the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The limit of the data length.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: The request is successfully finished. The response is sorted in descending order (DESC).
          content:
