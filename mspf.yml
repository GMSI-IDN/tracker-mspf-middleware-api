          type: integer
          description: ID of Device related to the Event
        status:
          type: string
          description: Status of the Event
          enum: ['OPEN', 'CLOSE']
        reason:
          type: string
          description: The reason why the Event's status was changed.
        openedAt:
          type: string
          format: date-time
          description: The date-time when the Event was opened.
        closedAt:
          type: string
          format: date-time
          description: The date-time when the Event was closed.
      required: [id, bcId, deviceId, monitorId, monitorName, status, reason, openedAt]
    EventV4:
      type: object
      properties:
        id:
          type: integer
          description: ID of the Event
        bcId:
          type: integer
          description: ID of the BC
