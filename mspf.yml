        '409':
          description: |
            The following case is 409 response code.
            In case duplicate config keys found in configValues.
      tags:
        - MccsConfigRules
  '/v4/mccs/config-rules/check':
    post:
      summary: Check MCCS config rule (simulation, no DB update)
      description: |
        Simulates which values would win for the given `conditionCheck` and compares the input
        `conditionRule` + `configValues` (or the rule loaded by `ruleID` as fallback) against the current
        approved winner per `configKey`. Does not persist changes.
        Either provide `conditionRule` and `configValues` in the body, or set `ruleID` to fall back
        to that rule's conditions and values.

        Winner ordering matches approved rules in the DB: condition specificity score, then firmware version,
        then **`conditionRule.priority`** (higher wins), then insert time, then rule ID. Include `priority`
        inside **`conditionRule`** when simulating so tie-breaks match a future save; if omitted with `ruleID`,
        the stored rule's priority is used; if omitted without `ruleID`, priority defaults to `1`.
        Do not send `priority` under `conditionCheck` (it is ignored there).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MccsConfigRuleCheckRequest'
      responses:
        '200':
          description: One row per `configKey` in the request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MccsConfigRuleCheckResultItem'
        '400':
          description: Invalid body or missing required pair (e.g. neither ruleID nor conditionRule)
        '403':
          description: You don't have MAINTENANCE option.
        '404':
          description: The referenced `ruleID` is not found (when `ruleID` is sent)
      tags:
        - MccsConfigRules
