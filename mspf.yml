    DeviceTypeV4:
      type: object
      properties:
        id:
          type: number
          description: The ID of the DeviceType
        name:
          $ref: '#/components/schemas/DeviceTypeName'
        firmwareVersions:
          type: array
          items:
            $ref: '#/components/schemas/FirmwareVersions'
      required: [id, name]
    SmsDetail:
      type: object
      properties:
        smsMsgId:
          type: number
          example: 106184
          description: Unique identifier for SMS messages.
        status:
          type: string
          enum: [Received, Cancelled, CancelFailed, CancelPending, Delivered, Pending, Failed, Unknown]
          example: Pending
          description: |
            Message delivery status. Valid values depend on the message type.
            - Device origination (MO):
              - Received
            - Device incoming call (MT):
              - Cancelled
              - CancelFailed
              - CancelPending
              - Delivered
              - Pending
              - Failed
              - Unknown
        messageText:
          type: string
          example: Hello world
          description: SMS body.
        senderLogin:
          type: string
          example: dpTrialUser2
          description: Identifies the source of the message.
        iccid:
          type: string
          example: "8988216716970004975"
          description: Unique ID that identifies the sim.
        sendTo:
          type: string
          example: "882351697004975"
          description: Identifies the destination of the message.
        sendFrom:
          type: string
          example: Server
          description: Identify the device or computer that sent the message.
        msgType:
          type: string
          enum: [MT, MO]
          example: MT
          description: Returns the SMS message type as MT or MO
        dateSent:
          type: string
          example: 2016-07-06 16:05:16.280-0700
          description: |
            The date and time the message was sent (including time zone).
            (Returned only if the message type is MT)
        dateReceived:
          type: string
          example: 2016-07-06 16:05:16.280-0700
          description: The date and time the message was received (including time zone).
        dateModified:
          type: string
          example: 2016-07-06 16:05:16.280-0700
          description: Date and time (including time zone) when the delivery status was changed.
      required:
        - smsMsgId
        - status
        - messageText
        - senderLogin
        - iccid
        - sendTo
        - sendFrom
        - msgType
        - dateModified
    FirmwareVersions:
      type: object
      properties:
        name:
          type: string
          description: The Name of the DeviceVersion
        isReleased:
          type: boolean
    DeviceGeofence:
      type: object
      properties:
        id:
          type: number
          description: ID of the device geofence
        name:
          type: string
          description: Name of the device geofence
        lat:
          type: number
          description: latitude of the device geofence
        lon:
          type: number
          description: longitude of the device geofence
        status:
          type: string
          enum: [ENABLE, DISABLE]
          description: status of the device geofence
        desiredStatus:
          type: string
          enum: [INACTIVE, INACTIVE_ONESHOT]
          description: activation desired status of the device geofence. In the case of `INACTIVE_ONESHOT` , the activation command is sent only once.
        radius:
          type: number
          description: radius of the device geofence
        startTime:
          type: string
          description: Execution start time of the device geofence
        endTime:
          type: string
          description: Execution end time of the device geofence
        locationAddr:
          type: string
          description: address of the device geofence
        createdAt:
          type: string
          format: date-time
          description: Time when the device geofence is created
        expirationDateTime:
          type: string
          format: date-time
          description: expiration date of the device geofence
      required: [id, name, lat, lon, status, radius, desiredStatus, startTime, endTime, locationAddr]
    MCCSHistory:
