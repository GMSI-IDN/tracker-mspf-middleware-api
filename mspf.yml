          items:
            type: string
            format: email
          minItems: 1
          maxItems: 10
      required: [id, bcId, type, note]
    StatsDeviceReports:
      type: object
      properties:
        mileage:
          type: integer
          nullable: true
          description: Mileage of the Device (km).
        drivingtime:
          type: integer
          nullable: true
          description: |
            Driving Time of the Device (seconds).
            Time when the device is on and running.
        datetime:
          type: string
          format: date
          description: Date of Aggregation (YYYY-MM-DD)
      required: [datetime]
    StatsBcReports:
      type: object
      properties:
        deviceId:
          type: integer
          description: ID of the Device.
        vin:
          type: string
          description: Vehicle Identification Number.
        mileage:
          type: number
          nullable: true
          description: Mileage of the Device (km).
        drivingtime:
          type: integer
          nullable: true
          description: |
            Driving Time of the Device (seconds).
            Time when the device is on and running.
        datetime:
          type: string
          format: date
          description: Date of Aggregation (YYYY-MM-DD). In case of MONTHLY, it returns the first day of month (YYYY-MM-01).
      required: [datetime]
    StatsDeviceParkings:
      type: object
      properties:
        parkingStartTime:
          type: string
          format: date-time
          description: Parking start datetime.
        parkingTime:
          type: number
          description: Parking time by minute.
        position:
          type: object
          properties:
            lat:
              type: number
              format: float
              nullable: true
              description: latitude
              example: 35.681382
            lon:
              type: number
              format: float
              nullable: true
              description: longitude
              example: 139.766084
          required: [lat, lon]
      required: [parkingStartTime, parkingTime, position]
    StatsDeviceSummary:
      type: object
      properties:
        deviceId:
          type: integer
          description: ID of the Device
        totalMileage:
          type: number
          description: Total Mileage of the Device (km).
        totalDrivingtime:
          type: integer
          description: |
            Total Driving Time of the Device (seconds).
            Time when the device is on and running.
        firstCommunicatedAt:
          type: string
          format: date-time
          description: First communication time of the device on the Stats data infrastructure.
        lastCommunicatedAt:
          type: string
          format: date-time
          description: Last communication time of the device on the Stats data infrastructure.
        updatedAt:
          type: string
          format: date-time
          description: Last update time on the Stats data infrastructure.
      required: [deviceId]
    StatsParkingHourly:
      type: object
      properties:
        asOfDate:
          type: string
          format: date
          description: Date of the parking data (YYYY-MM-DD)
          example: '2023-01-15'
        parkingFlag:
          type: array
          description: |
            Array of 24 elements representing parking status for each hour of the day (0-23).
            Each element can be a number (ranking) or null (no parking data).
            - null: No parking data for that hour
            - 0: Parked but no ranking
            - 1-5: Parking ranking (1 being the highest)
          items:
            type: integer
            nullable: true
            minimum: 0
            maximum: 5
          minItems: 24
          maxItems: 24
          example: [null, null, null, null, null, null, 1, 2, null, null, 0, 0, 0, null, null, null, null, null, 3, 1, null, null, null, null]
      required: [asOfDate, parkingFlag]
