          enum:
            - MCCS III
          description: Type Name
        data:
            type: object
            properties:
              lotNo:
                type: string
                maxLength: 20
                example: GMSK_MP210923
                description: lotNo.
              uniqueId:
                type: string
                maxLength: 30
                description: Unique ID, No duplicate numbers of Product
              firmwareVersion:
                type: string
                maxLength: 10
                example: MC3.02
              hardwareVersion:
                type: string
                maxLength: 10
                example: '1.0'
              3gImeiNo:
                type: string
                maxLength: 20
                description: Modem IMEI No.
              3gVersion:
                type: string
                maxLength: 30
                description: Modem FW Version
              temperature:
                type: number
                description: Temperature measured by the product
                example: 31
              boardTemperature:
                type: number
                description: Same of Temp(for backwards compatibility)
                example: 31
              testResult:
                type: string
                maxLength: 10
                example: FFFFFFFF
            required:
