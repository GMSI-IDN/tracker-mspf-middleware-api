          type: string
          description: Access Token
        token_type:
          type: string
          description: Token type (there is only "bearer" token at this time)
          enum:
            - bearer
        expires_in:
          type: integer
          description: |
            expiration time (Unit: second)
      required:
        - access_token
        - token_type
        - expires_in
    Audit:
      type: object
      properties:
        userId:
