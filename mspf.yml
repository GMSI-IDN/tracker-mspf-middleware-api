          description: The config rule is not found.
      tags:
        - MccsConfigRules
  '/v4/mccs/config-devices':
    get:
      summary: Get a list of MCCS config devices
      description: |
        Query MCCS devices with optional filters and diff check.
        Diff check compares current device config with expected config from rules.
        Excluded devices (isExcludedMccsConfig = 1) always return diff = false.
        Last communication time (`lastCommunicatedAt`) comes from mobility data latest (`m_mobilitydatalatest.updDtm`), same semantics as device `lastCommunicatedAt` in v3.
        Requires MAINTENANCE option.
      parameters:
        - name: deviceID
          in: query
          description: Filter by device ID
          schema:
            type: integer
        - name: deviceTypeID
          in: query
          description: Filter by MCCS device type ID
          schema:
            type: integer
        - name: basicContractID
          in: query
          description: Filter by basic contract ID
          schema:
            type: integer
        - name: fwVer
          in: query
          description: Filter by firmware version
          schema:
            type: string
            maxLength: 50
        - name: serviceID
          in: query
          description: Filter by service ID
          schema:
            type: integer
        - name: countryID
          in: query
          description: Filter by country ID (basic contract country)
          schema:
            type: integer
        - name: carrierID
          in: query
          description: Filter by SIM carrier ID (matched via device ICCID)
          schema:
            type: integer
        - name: vehicleAttributeID
          in: query
          description: Filter by vehicle attribute ID (matched via device tags)
          schema:
            type: integer
        - name: isExcludedMccsConfig
          in: query
          description: Filter by MCCS config exclusion flag
          schema:
            type: string
            enum: ['true', 'false', '0', '1']
        - name: diffCheck
          in: query
          description: When true, include diff flag (device config differs from rule-expected)
          schema:
            type: string
            enum: ['true', 'false', '0', '1']
        - name: lastCommunicatedAtRange
          in: query
          description: |
            Filter by last communication time window. `older30d` includes devices with no communication record (null).
          schema:
            type: string
            enum: [last24h, last7d, last30d, older30d]
        - name: sortBy
          in: query
          description: Sort field; default is device ID ascending when omitted
          schema:
            type: string
            enum: [deviceID, lastCommunicatedAt]
        - name: sortOrder
          in: query
          description: Sort direction (use with sortBy)
          schema:
            type: string
            enum: [ASC, DESC]
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: MCCS config device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MccsConfigDeviceListItem'
                  paging:
                    type: object
                    properties:
                      page:
                        type: integer
                      perPage:
                        type: integer
                      total:
                        type: integer
                    required: [page, perPage, total]
                required: [data, paging]
        '400':
          description: Invalid parameter format or perPage exceeds limit (200).
        '403':
          description: You don't have MAINTENANCE option.
      tags:
        - MccsConfigDevices
  '/v4/mccs/config-devices/{deviceID}':
    get:
      summary: Get MCCS config device detail
      description: |
        Returns device config detail and diff check result.
        Shows current config values vs expected values from rules, and matching conditions.
        Requires MAINTENANCE option.
      parameters:
        - name: deviceID
          in: path
          description: Device ID
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: MCCS config device detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MccsConfigDeviceDetail'
        '400':
          description: Invalid deviceID format.
        '403':
          description: You don't have MAINTENANCE option.
        '404':
          description: The device is not found.
      tags:
        - MccsConfigDevices
  '/v4/mccs/search':
    get:
      summary: Search MCCS config items by conditions
      description: |
        Search MCCS config items (config values from rules) by rule conditions and config keys.
        Returns matching config values with rule metadata.
        Requires MAINTENANCE option.
      parameters:
        - name: conditionDeviceTypeID
          in: query
          description: Filter by MCCS device type IDs. Accepts positive integer string or "null".
          schema:
            type: array
            items:
              type: string
              pattern: ^(null|[1-9][0-9]*)$
        - name: conditionFwVer
          in: query
          description: Filter by firmware versions. Accepts a version string or "null" (matches rules whose firmware version condition is unset/NULL).
          schema:
            type: array
            items:
              type: string
              maxLength: 50
        - name: conditionCarrierID
          in: query
          description: Filter by carrier IDs. Accepts positive integer string or "null".
          schema:
            type: array
            items:
              type: string
              pattern: ^(null|[1-9][0-9]*)$
        - name: conditionCountryID
          in: query
          description: Filter by country IDs. Accepts positive integer string or "null".
          schema:
            type: array
            items:
              type: string
              pattern: ^(null|[1-9][0-9]*)$
        - name: conditionServiceID
          in: query
          description: Filter by service IDs. Accepts positive integer string or "null".
          schema:
            type: array
            items:
              type: string
              pattern: ^(null|[1-9][0-9]*)$
        - name: conditionProcess
          in: query
          description: Filter by process conditions
          schema:
            type: array
            items:
              type: string
              enum: [SHIPMENT, OPERATION]
        - name: conditionVehicleAttributeID
          in: query
          description: Filter by vehicle attribute IDs. Accepts positive integer string or "null".
          schema:
            type: array
            items:
              type: string
              pattern: ^(null|[1-9][0-9]*)$
        - name: configKey
          in: query
          description: Filter by config key
          schema:
            type: string
            maxLength: 100
        - name: configNumber
          in: query
          description: Filter by config number
          schema:
            type: string
        - name: commandKey
          in: query
          description: Filter by command key
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: MCCS config search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MccsSearchItem'
                  paging:
                    type: object
                    properties:
                      page:
                        type: integer
                      perPage:
                        type: integer
                      total:
                        type: integer
                    required: [page, perPage, total]
                required: [data, paging]
        '403':
          description: You don't have MAINTENANCE option.
      tags:
        - MccsSearch
  '/v4/mccs/apply-rules':
    post:
      summary: Apply MCCS values per rules to devices
      description: |
        Apply rule-based MCCS config values to specified devices.
        Requires MAINTENANCE option.
        Specify either deviceIds or deviceSerialNo (not both).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceIds:
                  type: array
                  items:
                    type: integer
                  description: Array of device IDs
                deviceSerialNo:
                  type: array
                  items:
                    type: string
                  description: Array of device serial numbers
      responses:
        '200':
          description: MCCS values applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Empty object
                  message:
                    type: string
                    example: ãƒ‡ãƒã‚¤ã‚¹ã«æœ€æ–°ã®MCCSå€¤ã‚’é©ç”¨ã•ã‚Œã¾ã—ãŸã€‚
                required: [data, message]
        '400':
          description: |
            Invalid request. Either deviceIds or deviceSerialNo is required.
            deviceIds and deviceSerialNo cannot both be specified.
            A non-existent Device is included in the specified Devices.
        '403':
          description: You don't have MAINTENANCE option.
      tags:
        - MccsConfigRules

components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: |
        Authentication and authorization by OAuth 2.0
        ([RFC6749](https://tools.ietf.org/html/rfc6749)) is required
        to access all resource APIs from your own client applications
        (client apps).
        Allowed authorization grant type is "client credentials" or "refresh token".
        Client apps need to execute the following flow to access resources.
        1. Acquisition of Client Credentials: Get client credentials
        (`client_id` and `client_secret`) for client
        authentication, from GMS.
        Or visit https://auth.cloud-gms.com?redirect=(application_url) to get refresh token.
        You do not need to get credentials again unless the existing
        credentials are invalidated, but your client app should be able to
        exchange the credentials as necessary.
        2. Acquisition of an Access Token: Issue an access token
        (`access_token`) by using the client credentials (See also
        "POST /oauth2/token" description).
        Access tokens have expiration time, so client apps need to get new
        access token by using the same client credentials after expiration
        of old one and to exchange the old one for the new one.
        3. Access to resources: Access to resources is authorized by
        including the valid access token to request (Authorization header
        field) of resource API calls.
      flows:
        clientCredentials:
          tokenUrl: 'https://api.cloud-gms.com/v1/oauth2/token'
          scopes: {}
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication is required to issue an access token by
        token API whose grant_type is client_credentials (POST /oauth2/token).
        `client_id` and `client_secret` are required as username and password.
        You should get the client credentials in advance from GMS.

        Please note that this is NOT for resource API access.

        If grant_type is refresh_token, basic authentication is unnecessary.
  schemas:
    v2pagingStart:
      type: integer
      description: start index of data
    v2pagingLength:
      type: integer
      description: length of data
    v2pagingTotal:
      type: integer
      description: total of data
    v2pagingSort:
