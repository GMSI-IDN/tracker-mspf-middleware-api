          required: false
        - name: packedTo
          in: query
          description: The end of the packed time range. Specify in combination with `packedFrom`.
          schema:
            type: string
            format: date-time
            example: '2020-07-25T12:45:28Z'
          required: false
        - name: receivedFrom
          in: query
          description: The start of the received time range. Specify in combination with `receivedTo`.
          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
          required: false
        - name: receivedTo
          in: query
