        name:
          type: string
          description: Name of the Notification
        monitorIds:
          type: array
          items:
            type: integer
          description: IDs of the Monitors
        destinationIds:
          type: array
          items:
            type: integer
          description: IDs of the Destinations
        renotifyInterval:
          type: integer
          enum: [0, 5, 15, 60, 360, 1440]
          default: 0
          description: The time interval (minutes) to notify again. 0 means the Notification is oneshot
