            example: 'IN'
          value:
            type: array
            description: Array of deviceTypeId
            items:
              type: integer
            example: [1, 2, 3]
      - properties:
          source:
            type: string
            description: Area defined by a circle.
            enum: ['geofence.circle']
          operator:
            type: string
            enum: ['IN', 'OUT']
            description: Either inside or outside the area
            example: 'IN'
          value:
            type: object
            properties:
              lat:
                type: number
                format: float
                description: latitude
                example: 35.681382
              lon:
                type: number
