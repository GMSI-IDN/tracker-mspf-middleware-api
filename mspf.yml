openapi: 3.0.3
info:
  title: GMS WebAPI Specification
  contact:
    name: Global Mobility Service, Inc.
    email: mspf-api-support@global-mobility-service.com
  description: >
    This is the documents of the API under development.
    This document only lists the APIs implemented in this version.
  version: '1.0'
servers:
  - url: https://api.cloud-gms.com
paths:
  '/v1/oauth2/token':
    post:
      summary: Issue an access token for resource API call by OAuth2.0 manner
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                  description: |
                    Grant type of OAuth2.0. Only `client_credentials` is supported.
              required:
                - grant_type
      responses:
        '200':
          description: Information of access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >
            The following case is 400 response code.
              - The request is missing a required parameter or the specified parameter is invalid. In this case, `invalid_request` will be returned.
              - The authorization grant type is not supported. In this case, `unsupported_grant_type` will be returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ['invalid_request', 'unsupported_grant_type']
                required: [error]
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ['invalid_client']
                required: [error]
      tags:
        - OAuth
      security:
        - basicAuth: []
  '/v4/tenants':
    post:
      summary: Create new TENANT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Name of the TENANT(unique name)
                note:
                  type: string
                  maxLength: 200
                  description: Supporting information
                bcList:
                  type: array
                  description: List of BC. Set the list of the `bcId` if you allow the BC to access the TENANT
                  items:
                    type: integer
                    description: Id of the BC
                users:
                  type: array
                  items:
                    type: integer
                    description: IDs of the User.
                limitTypeT:
                  type: integer
                  nullable: true
                  description: Limit number of Type T devices
              required:
                - name
      responses:
        '200':
          description: The request is successfully finished. The created TENANT is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TENANT'
        '400':
          description: The request is invalid.
        '403':
          description: (Only internal Admin User) You don't have `TENANT` option.
        '409':
          description: >
            The request failed because the request conflicts with `name`.
      tags:
        - TENANT
    get:
      summary: Get a list of TENANTs
      parameters:
        - name: name
          in: query
          description: Name of the TENANT.
          schema:
            type: string
        - name: start
          in: query
          description: The token of `next` from the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The limit of the data length.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: A list of TENANTs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TENANT'
                  total:
                    type: integer
                    description: Total number of data
                  next:
                    type: string
                    nullable: true
                    description: The token of the following page
                required: [data, total]
        '403':
          description: |
            - You are not internal User.
      tags:
        - TENANT
  '/v4/tenants/{tenantId}':
    put:
      summary: Update the TENANT
      parameters:
        - name: tenantId
          in: path
          description: ID of the TENANT
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Name of the TENANT(unique name)
                note:
                  type: string
                  maxLength: 200
                  description: Supporting information
                bcList:
                  type: array
                  description: List of BC. Set the list of the `bcId` if you allow the BC to access the TENANT
                  items:
                    type: integer
                    description: Id of the BC
                users:
                  type: array
                  items:
                    type: integer
                    description: IDs of the User.
                limitTypeT:
                  type: integer
                  nullable: true
                  description: Limit number of Type T devices
      responses:
        '200':
          description: >
            The request is successfully finished. The updated TENANT is
            returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TENANT'
        '403':
          description: You are not internal User.
        '404':
          description: The TENANT is not found.
        '409':
          description: >
            The request failed because the request conflicts with `name`.
      tags:
        - TENANT
    delete:
      summary: Delete the TENANT
      parameters:
        - name: tenantId
          in: path
          description: ID of the TENANT
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: The request is successfully finished.
        '403':
          description: (Only internal Admin User) You don't have `TENANT` option.
        '404':
          description: The TENANT is not found.
      tags:
        - TENANT
    get:
      summary: Get the TENANT
      parameters:
        - name: tenantId
          in: path
          description: ID of the TENANT
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/TENANT'
        '403':
          description: (Only internal Admin User) You don't have `TENANT` option.
        '404':
          description: The TENANT is not found.
      tags:
        - TENANT
  '/v4/tenants/{tenantId}/bcs/{bcId}':
    post:
      summary: Add BC to tenant
      parameters:
        - name: tenantId
          in: path
          schema:
            type: integer
          description: ID of the TENANT
          required: true
        - name: bcId
          in: path
          schema:
            type: integer
          description: ID of the BC
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: |
            - You don't have `TENANT` option.
        '404':
          description: The `tenantId` or `bcId` is not found.
        '409':
          description: The request failed because the request conflicts with BC.
      tags:
        - TENANT
    delete:
      summary: Remove bc from TENANT
      parameters:
        - name: tenantId
          in: path
          schema:
            type: integer
          description: ID of the TENANT
          required: true
        - name: bcId
          in: path
          schema:
            type: integer
          description: ID of the BC
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: |
            - You don't have `TENANT` option.
        '404':
          description: The `tenantId` or `bcId` is not found.
      tags:
        - TENANT
  '/v4/tenants/{tenantId}/users/{userId}':
    post:
      summary: Add user to TENANT
      parameters:
        - name: tenantId
          in: path
          schema:
            type: integer
          description: ID of the TENANT
          required: true
        - name: userId
          in: path
          schema:
            type: integer
          description: ID of the User
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: |
            - You don't have `TENANT` option.
        '404':
          description: The `tenantId` or `userId` is not found.
        '409':
          description: The request failed because the request conflicts with User.
      tags:
        - TENANT
    delete:
      summary: Remove user from TENANT
      parameters:
        - name: tenantId
          in: path
          schema:
            type: integer
          description: ID of the TENANT
          required: true
        - name: userId
          in: path
          schema:
            type: integer
          description: ID of the User
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: |
            - You don't have `TENANT` option.
        '404':
          description: The `tenantId` or `userId` is not found.
      tags:
        - TENANT
  '/v4/device-types':
    get:
      summary: Get a list of DeviceTypes
      parameters:
        - name: id
          in: query
          schema:
            $ref: '#/components/schemas/DeviceTypeId'
          description: ID of the DeviceType
        - name: name
          deprecated: true
          in: query
          schema:
            $ref: '#/components/schemas/DeviceTypeName'
          description: Name of the DeviceType
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceTypeV4'
                required: [data]
        '400':
          description: The specified name of DeviceType is invalid.
        '403':
          description: You don't have `MAINTENANCE` option.
      tags: [DeviceType]
  '/v4/device-types/{deviceTypeId}':
    get:
      summary: Get the DeviceType
      parameters:
        - name: deviceTypeId
          in: path
          description: The ID of the DeviceType
          schema:
            $ref: '#/components/schemas/DeviceTypeId'
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTypeV4'
        '403':
          description: You don't have `MAINTENANCE` option.
        '404':
          description: The DeviceType is not found.
      tags: [DeviceType]
    patch:
      summary: Update the DeviceType
      parameters:
        - name: deviceTypeId
          in: path
          description: The ID of the DeviceType
          schema:
            $ref: '#/components/schemas/DeviceTypeId'
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firmwareVersions:
                  type: array
                  description: A list of the firmwareVersion
                  items:
                    $ref: '#/components/schemas/FirmwareVersions'
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTypeV4'
        '403':
          description: You don't have `MAINTENANCE` option.
        '404':
          description: The DeviceType is not found.
      tags: [DeviceType]
  '/v1/bcs':
    post:
      summary: Create new BC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Name of the BC(unique name)
                isoCountryCode:
                  $ref: '#/components/schemas/ISOCountryCode'
                email:
                  type: string
                  maxLength: 100
                  description: E-mail address of the BC
                note:
                  type: string
                  maxLength: 200
                  description: Supporting information such as full company name
                config:
                  $ref: '#/components/schemas/BCConfig'
                owners:
                  type: array
                  items:
                    type: integer
                    description: IDs of the BC Owner. You are an owner in default.
                tenantList:
                  type: array
                  items:
                    type: integer
                    description: IDs of the Tenant.
                serviceId:
                  type: integer
                  nullable: true
                  description: ID of the Service linked to the BC (c_service.serviceID).
              required:
                - name
      responses:
        '200':
          description: The request is successfully finished. The created BC is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BC'
        '400':
          description: The request is invalid.
        '403':
          description: You don't have `BC` option.
        '404':
          description: The Tenant is not found.
        '409':
          description: >
            The request failed because the request conflicted with existing
            BC (e.g. Name conflict).
      tags:
        - BC
  '/v1/bcs/{bcId}':
    put:
      summary: Update information of BC
      parameters:
        - name: bcId
          in: path
          description: ID of the BC
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Name of the BC(unique name)
                isoCountryCode:
                  $ref: '#/components/schemas/ISOCountryCode'
                email:
                  type: string
                  maxLength: 100
                  description: E-mail address of the BC
                note:
                  type: string
                  maxLength: 200
                  description: Supporting information such as full company name
                owners:
                  type: array
                  items:
                    type: integer
                    description: IDs of the BC Owner
                    minItems: 1
                config:
                  $ref: '#/components/schemas/BCConfig'
                tenantList:
                  type: array
                  items:
                    type: integer
                    description: IDs of the Tenant.
                serviceId:
                  type: integer
                  nullable: true
                  description: ID of the Service linked to the BC (c_service.serviceID).
      responses:
        '200':
          description: >
            The request is successfully finished. The updated BC is
            returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Id of the BC
                  name:
                    type: string
                    description: Name of the BC
        '403':
          description: You are not BC Owner.
        '404':
          description: |
            - The BC is not found.
            - The Tenant is not found.
        '409':
          description: >
            The request failed because the request conflicted with existing
            BC (e.g. Name conflict).
      tags:
        - BC
    delete:
      summary: Delete BC
      parameters:
        - name: bcId
          in: path
          description: ID of the BC
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: The request is successfully finished.
        '403':
          description: You are not BC Owner.
        '404':
          description: The BC is not found.
      tags:
        - BC
  '/v3/devices':
    post:
      summary: Create a new Device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bcId:
                  type: integer
                  description: ID of the BC
                deviceTypeId:
                  $ref: '#/components/schemas/DeviceTypeId'
                deviceType:
                  $ref: '#/components/schemas/DeviceTypeName'
                mobileNo:
                  $ref: '#/components/schemas/MobileNumberInput'
                status:
                  type: string
                  default: 'WORKING'
                  enum: ['WORKING', 'SUSPENDED']
                tags:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 100
                  description: Tags of the Device.
                  maxLength: 20
                imei:
                  $ref: '#/components/schemas/IMEIInput'
              required: [bcId]
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '403':
          description: You don't have `DEVICE` option.
        '404':
          description: The BC is not found.
        '409':
          description: The `mobileNo` is already in use or The `imei` is already in use.
      tags:
        - Device
    get:
      summary: Get a list of Devices
      parameters:
        - name: bc[]
          in: query
          description: An array of the bcId
          schema:
            type: array
            items:
              type: integer
          example: [1, 2]
        - name: device[]
          in: query
          description: |
            An array of the deviceId.
          schema:
            type: array
            items:
              type: integer
          example: [1, 2]
        - name: deviceTypeId
          in: query
          schema:
            $ref: '#/components/schemas/DeviceTypeId'
        - name: deviceType
          deprecated: true
          in: query
          schema:
            $ref: '#/components/schemas/DeviceTypeName'
        - name: mobileNo
          in: query
          schema:
            $ref: '#/components/schemas/MobileNumberInput'
        - name: status
          in: query
          schema:
            type: string
            enum: ['WORKING', 'SUSPENDED']
          required: false
        - name: tags
          in: query
          style: deepObject
          explode: true
          description: Tags of the Device. Normally it is AND search, but if you specify multiple tags with the same key, they will be an OR search.
          schema:
            type: object
          example: {'tag1': 'value1', 'tag2': 'value2'}
        - name: tags[]
          in: query
          description: Tags of the Device. You can use `tags[]` to search multiple keys of tags.
          schema:
            type: array
            items:
              type: string
          example: ['tag1', 'tag2']
        - name: query
          in: query
          description: query word of search condition.
          schema:
            type: string
          required: false
        - name: start
          in: query
          description: The token of `next` from the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The limit of the data length.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: activationCurrentStatus
          in: query
          description: Status of each terminal. Returns `ACTIVE` if the terminal is "under start control" and `INACTIVE` if the terminal is "under stop control".
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
        - name: activationReservation
          in: query
          description: With or without activation reservation.
          schema:
            type: string
            enum: ['ON', 'OFF']
        - name: imei
          in: query
          schema:
            $ref: '#/components/schemas/IMEIInput'
        - name: fwVersion[]
          in: query
          description: FW version of the device.
          schema:
            type: array
            items:
              type: string
          example: ['IIIJ1.04', 'IIIJ1.05Test']
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  total:
                    type: integer
                    description: Total number of data
                  next:
                    type: string
                    nullable: true
                    description: The token of the following page
                required: [data, total]
        '404':
          description: The BC is not found.
      tags:
        - Device
  '/v3/devices/{deviceId}':
    get:
      summary: Get the Device
      parameters:
        - name: deviceId
          in: path
          description: ID of the Device
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/Device'
        '404':
          description: The Device is not found.
      tags:
        - Device
    patch:
      summary: Update the Device
      parameters:
        - name: deviceId
          in: path
          description: ID of the Device
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bcId:
                    type: integer
                    description: ID of the BC
                deviceTypeId:
                  $ref: '#/components/schemas/DeviceTypeId'
                deviceType:
                  $ref: '#/components/schemas/DeviceTypeName'
                mobileNo:
                  $ref: '#/components/schemas/MobileNumberInput'
                status:
                  type: string
                  enum: ['WORKING', 'SUSPENDED']
                tags:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 100
                  description: Tags of the Device.
                  maxLength: 20
                imei:
                  $ref: '#/components/schemas/IMEIInput'
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '403':
          description: You don't have `DEVICE` option.
        '404':
          description: The Device is not found.
        '409':
          description: The `mobileNo` is already in use or The `imei` is already in use.
      tags:
        - Device
    delete:
      summary: Delete the Device
      parameters:
        - name: deviceId
          in: path
          description: ID of the Device
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
                schema:
                  type: object
        '403':
          description: You don't have `DEVICE` option.
        '404':
          description: The Device is not found.
      tags:
        - Device
  '/v3/devices/positions':
    get:
      summary: Get a list of positions of Devices
      parameters:
        - name: rectangle
          in: query
          description: Rectangle with two latitudes and longitudes. (lat1,lon1) and (lat2,lon2).
          schema:
            type: string
          example: rectangle=lat1,lon1,lat2,lon2   e.q.)rectangle=33.671,-116.251,33.685,-116.234
        - name: bc[]
          in: query
          description: An array of the bcId
          schema:
            type: array
            items:
              type: integer
          example: [1, 2]
        - name: start
          in: query
          description: The token of `next` from the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The limit of the data length.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceId:
                          type: integer
                        position:
                          $ref: '#/components/schemas/Position'
                      required: [deviceId, position]
                  total:
                    type: integer
                    description: Total number of data
                  next:
                    type: string
                    nullable: true
                    description: The token of the following page
                    example: null
                required: [data]
        '404':
          description: The BC is not found.
      tags:
        - DeviceData
  '/v3/devices/{deviceId}/route':
    get:
      summary: Get position history within the period for the Device
      parameters:
        - name: deviceId
          in: path
          description: ID of the Device
          schema:
            type: integer
          required: true
        - name: from
          in: query
          description: the start of the time range.
          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
          required: false
        - name: to
          in: query
          description: the end of the time range. (Default the latest time of device data.)
          schema:
            type: string
            format: date-time
            example: '2020-07-25T12:45:28Z'
          required: false
        - name: start
          in: query
          description: The token of `next` from the previous page.
          schema:
            type: string
      responses:
        '200':
          description: The request is successfully finished. The response is sorted in descending order (DESC).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  next:
                    type: string
                    nullable: true
                    description: The token of the following page
                    example: null
                required: [data]
        '400':
          description: >
            The following case is 400 response code.
            In case specified parameter is in wrong format.
        '404':
          description: The Device is not found.
      tags: [DeviceData]
  '/v2/device/{deviceId}/data/history':
    get:
      summary: Get the history of the device data. The data retention period is 1 year.
      parameters:
        - name: deviceId
          in: path
          description: ID of the Device
          schema:
            type: integer
          required: true
        - name: from
          in: query
          description: the beginning of the history. Maximum time you can specify is 24 hours. Without from and to, you get data for an hour by the latest time of device data.
          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
          required: false
        - name: to
          in: query
          description: the end of the history. Maximum time you can specify is 24 hours. Without from and to, you get data for an hour by the latest time of device data.
          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
          required: false
      responses:
        '200':
          description: The request is successfully finished. The response is sorted in ascending order (ASC).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        data:
                          type: object
                          description: Data from MCCS.
                        createdAt:
                          type: string
                          format: date-time
                          description: Timestamp of when the MCCS data was created.
                        insDtm:
                          type: string
                          format: date-time
                          nullable: true
                          description: Timestamp of when the data arrives at MSPF.
                      required: [data, createdAt]
                required: [data]
        '400':
          description: >
            The following case is 400 response code.
            In case specified parameter is in wrong format.
            In case the time span between `from` and `to` is over 24 hours.
            In case `from` or `to` is after today.
            In case the length of the specified time is negative.
        '404':
          description: The Device corresponding to `deviceId` is not found.
      tags:
        - DeviceData
