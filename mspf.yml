            The following case is 400 response code.
            In case specified parameter is in wrong format.
            In case duplicate config keys found in configValues.
        '403':
          description: You don't have MAINTENANCE option.
        '404':
          description:
            The config rule is not found.
            The config items are not found. The response message includes the list of missing config keys.
