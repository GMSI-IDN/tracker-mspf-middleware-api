        note:
          type: string
          maxLength: 200
          description: note
    UserOptions:
      description: Options of the User
      type: array
      items:
        type: string
        enum:
          - SUPERADMIN
          - TENANT
          - USER
          - BC
          - ACTIVATION
          - AUDIT
          - DEVICE
          - MAINTENANCE
          - MDATA
          - MONITOR
          - NOTIFICATION
          - STATS
          - REPORT
          - ACCOUNT
          - ACTIVATION_RESERVATION
    Request:
      description: Request for API
      type: object
      properties:
        method:
          type: string
          description: 'Request Method.'
        url:
          type: string
          description: 'Request Url.'
        body:
          type: object
          description: 'Request Body'
      required: [method, url]
    Response:
      description: Response for API
      type: object
      properties:
        code:
          type: integer
          description: 'Response Code.'
    Monitor:
      type: object
      properties:
        id:
          type: integer
          description: ID of the Monitor
        bcId:
          type: integer
          description: ID of the BC
        name:
          type: string
          description: Name of the Monitor
        deviceIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: integer
          description: The list of the Device IDs. If omitted, all devices in the BC are monitored.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MonitorRule'
        evaluationInterval:
          type: integer
          multipleOf: 5
          default: 0
          description: The time interval(minutes) of consecutive metric it takes before the Event is triggered.
        enabled:
          type: boolean
          default: true
          description: If the monitor is enabled. If `enabled` is false, all events will be closed and will not be opened.
      required: [id, bcId, name, rules, evaluationInterval, enabled]
    MonitorRule:
      type: object
      oneOf:
      - properties:
          source:
            type: string
            description: monitoring target in `mobilityData`
            pattern: '^mobilityData.+$'
            example: 'mobilityData.volt'
          operator:
            type: string
            enum: ['=', '!=', '>', '>=', '<', '<=']
            description: A comparison operator of the condition. When `value` type is string, `=` and `!=` are only available.
            example: '='
          value:
            oneOf:
              - type: number
              - type: string
            description: The threshold which causes a new Event
            example: 5
      - properties:
          source:
            type: string
            description: monitoring target in `config`
            pattern: '^config.+$'
            example: 'config.interval'
          operator:
            type: string
            enum: ['=', '!=', '>', '>=', '<', '<=']
            description: A comparison operator of the condition. When `value` type is string, `=` and `!=` are only available.
            example: '='
          value:
            oneOf:
              - type: number
              - type: string
            description: The threshold which causes a new Event
            example: 180
      - properties:
          source:
            type: string
            description: elapsed time(minutes) from the last communication time
            enum: ['connection.timeout']
          operator:
            type: string
            enum: ['>', '>=']
            description: A comparison operator of the condition
            example: '>'
          value:
            type: number
            description: The threshold which causes a new Event
            example: 5
      - properties:
          source:
            type: string
            description: An area which is defined by a series of coordinates
            enum: ['geofence.polygon']
          operator:
            type: string
            enum: ['IN', 'OUT']
            description: Either inside or outside the area
            example: 'IN'
          value:
            type: array
            minItems: 3
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
            description: Combination of latitude and longitude list
            example: [[35.170616, 136.897824], [35.69058, 139.418848], [36.374916, 140.405552]]
      - properties:
          source:
            type: string
            description: Desired Status to Activate or Deactivate the MCCS.
            enum: ['activation.desiredStatus']
          operator:
            type: string
            enum: ['=']
            description: A comparison operator of the condition.
            example: '='
          value:
            type: string
            enum: [ACTIVE, INACTIVE, ACTIVE_ONESHOT, INACTIVE_ONESHOT]
            description: Target Desired Status.
            example: ACTIVE
      - properties:
          source:
            type: string
            description: |
              monitoring target in stats data. (e.g. stats.[Time interval of the target data].[target data])
              The unit of mileage is kilometer.
              The unit of drivingtime is minute.
            enum: ['stats.total.mileage', 'stats.total.drivingtime', 'stats.monthly.mileage', 'stats.monthly.drivingtime', 'stats.weekly.mileage', 'stats.weekly.drivingtime', 'stats.daily.mileage', 'stats.daily.drivingtime']
            example: 'stats.monthly.mileage'
          operator:
            type: string
            enum: ['>', '>=', '<', '<=']
            description: A comparison operator of the condition.
            example: '>='
          value:
            oneOf:
              - type: number
            description: The threshold which causes a new Event
            example: 1000
      - properties:
          source:
            type: string
            description: Array of deviceTypeId to be monitored.
            enum: ['device.deviceTypeIds']
            example: 'device.deviceTypeIds'
          operator:
            type: string
            enum: ['IN', 'NOTIN']
            description: Applies or does not apply to the specified deviceTypeIds.
            example: 'IN'
          value:
            type: array
            description: Array of deviceTypeId
            items:
              type: integer
            example: [1, 2, 3]
      required: [source, operator, value]
    MonitorRuleV2:
      type: object
      oneOf:
      - properties:
