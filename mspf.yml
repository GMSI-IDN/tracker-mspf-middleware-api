      required: [id, key, value, resource]
    Monitor_V2:
      type: object
      properties:
        id:
          type: integer
          description: ID of the Monitor
        bcIds:
          type: array
          items:
            type: integer
          description: The list of the bc IDs.
        name:
          type: string
          description: Name of the Monitor
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MonitorRule'
        evaluationInterval:
          type: integer
          multipleOf: 5
          default: 0
          description: The time interval(minutes) of consecutive metric it takes before the Event is triggered.
        deviceIds:
          type: array
          items:
            type: integer
          description: The list of the Device IDs. If omitted, all devices in the BC are monitored.
        notifications:
          type: array
          items:
            type: integer
          description: The list of the notification IDs.
        enabled:
          type: boolean
          default: true
          description: If the monitor is enabled. If `enabled` is false, all events will be closed and will not be opened.
        updatedAt:
          type: string
          nullable: true
          format: date-time
          description: Last Update time of Monitor
        createdAt:
          type: string
          nullable: true
          format: date-time
          description: The time Monitor was created
        createdBy:
          type: number
          description: ID of the user who created the Monitor
        createdUserName:
          type: string
          description: Name of the user who created the Monitor
        type:
          type: string
          enum: [EXTERNAL, INTERNAL]
          description: Type of the Monitor depends on whether the created user is internal or external..
      required: [id, name, rules, evaluationInterval, enabled, createdBy, createdUserName, type]
    Notification_V2:
