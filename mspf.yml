        '200':
          description: The request is successfully finished.
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    uri:
                      type: string
                      format: uri
                      description: file uri
                      pattern: '^s3://.+$'
                      example: 's3://bucket/exampleSerialNo/exampleUniqueId.jpg'
                    contentType:
                      type: string
                      enum:
                        - 'image/jpeg'
                        - 'image/png'
                        - 'image/gif'
                        - 'image/webp'
                        - 'video/mp4'
                        - 'video/avi'
