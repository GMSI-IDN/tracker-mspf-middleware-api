  '/v2/monitor':
    get:
      summary: Get Monitor List
      parameters:
        - name: bcId
          in: query
          schema:
            type: integer
          description: ID of the BC
          required: true
        - name: name
          in: query
          schema:
            type: string
          description: Name of the Monitor (partial match)
        - $ref: '#/components/parameters/v2pagingStart'
        - $ref: '#/components/parameters/v2pagingLength'
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Monitor'
                  start:
                    $ref: '#/components/schemas/v2pagingStart'
                  length:
                    $ref: '#/components/schemas/v2pagingLength'
                  total:
                    $ref: '#/components/schemas/v2pagingTotal'
                required: [data, start, length, total]
        '403':
          description: You don't have `MONITOR` option.
        '404':
          description: The `bcId` is not found.
      tags:
        - Monitor
    post:
      summary: Create a new Monitor
      description: |
        Create a rule to monitor the device.
        Currently, the data that can be monitored are `mobilityData`, `config` and `connection`.
        For `mobilityData` and `config`, specify the source parameter as `mobilityData.volt` to monitor the internal value of each.
        For `connection`, set the source parameter to `connection.timeout` and monitor the elapsed time (minutes) from the last communication time.
        For `geofence`, set the source parameter to `geofence.polygon` and monitor device position.
        For `activation`, set the source parameter to `activation.desiredStatus` and monitor the Desired Status of Activation.
        For `stats`, set the source parameter to `stats.monthly.mileage` and monitor the monthly mileage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bcId:
                  type: integer
                  description: ID of the BC
                name:
                  type: string
                  minimum: 1
                  maximum: 100
                  description: Name of the Monitor
                deviceIds:
                  type: array
                  nullable: true
                  minItems: 1
                  maxItems: 50
                  items:
                    type: integer
                  description: The list of the Device IDs. If null or omitted, all devices in the BC are monitored.
                rules:
                  type: array
                  items:
                    $ref: '#/components/schemas/MonitorRule'
                  minItems: 1
                  maxItems: 20
                  description: List of Monitor's rules. A new Event is triggered if every rule is satisfied (`AND`).
                evaluationInterval:
                  type: integer
                  multipleOf: 5
                  default: 0
                  description: The time interval(minutes) of consecutive metric it takes before the Event is triggered.
                enabled:
                  type: boolean
                  default: true
                  description: If the monitor is enabled. If `enabled` is false, all events will be closed and will not be opened.
              required: [bcId, name, rules]
      responses:
        '200':
          description: The request is successfully finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '403':
          description: You don't have `MONITOR` option.
        '404':
          description: The `bcId` is not found.
      tags:
        - Monitor
