          schema:
            type: string
            format: date-time
            example: '2020-07-20T15:32:28Z'
          required: false
        - name: to
          in: query
          description: the end of the history. Maximum time you can specify is one week. Without from and to, you get data for one week by the latest time of config data.
          schema:
            type: string
            format: date-time
